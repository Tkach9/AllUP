
<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AllUP — Конструктор футболок</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f2f2f2;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            display: flex;
            margin-top: 20px;
            gap: 40px;
        }
        .preview {
            max-width: 400px;
        }
        .controls {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .buttons-group button {
            margin: 5px;
            padding: 10px 20px;
            border: 2px solid black;
            cursor: pointer;
        }
        .buttons-group .active {
            background: black;
            color: white;
        }
        .color-circle {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 2px solid black;
            cursor: pointer;
            display: inline-block;
            margin: 5px;
        }
        .color-circle.active {
            box-shadow: 0 0 10px #000;
        }
        button.order {
            background: black;
            color: white;
            padding: 10px 20px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h1>Створи свою унікальну футболку<br>у декілька кліків</h1>
    <div class="container">
        <div class="preview">
            <img id="shirt" src="shirt-orange.png" alt="Футболка" width="100%">
        </div>
        <div class="controls">
            <div>
                <strong>Місто:</strong><br>
                <div class="buttons-group" id="cities">
                    <button data-city="odessa" class="active">ОДЕСА</button>
                    <button data-city="kyiv">КИЇВ</button>
                    <button data-city="lviv">ЛЬВІВ</button>
                    <button data-city="kharkiv">ХАРЬКІВ</button>
                </div>
            </div>
            <div>
                <strong>Колір:</strong><br>
                <div id="colors">
                    <span class="color-circle active" style="background:#ffffff" data-color="white"></span>
                    <span class="color-circle" style="background:#ffa500" data-color="orange"></span>
                    <span class="color-circle" style="background:#000000" data-color="black"></span>
                </div>
            </div>
            <div>
                <label for="size"><strong>Оберіть розмір:</strong></label><br>
                <select id="size">
                    <option>S</option>
                    <option>M</option>
                    <option>L</option>
                    <option>XL</option>
                    <option>XXL</option>
                </select>
            </div>
            <button class="order">ОФОРМИТИ ЗАМОВЛЕННЯ</button>
        </div>
    </div>
    <script>
        const shirt = document.getElementById("shirt");
        const cities = document.getElementById("cities");
        const colors = document.getElementById("colors");

        cities.addEventListener("click", e => {
            if (e.target.tagName === "BUTTON") {
                [...cities.children].forEach(btn => btn.classList.remove("active"));
                e.target.classList.add("active");
                updateImage();
            }
        });

        colors.addEventListener("click", e => {
            if (e.target.classList.contains("color-circle")) {
                [...colors.children].forEach(c => c.classList.remove("active"));
                e.target.classList.add("active");
                updateImage();
            }
        });

        function updateImage() {
            const city = document.querySelector("#cities .active").dataset.city;
            const color = document.querySelector("#colors .active").dataset.color;
            shirt.src = `shirt-${city}-${color}.png`;
        }
    </script>
</body>
</html>
