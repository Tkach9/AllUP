
<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>AllUP — Конструктор футболок</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f3f3f3;
            margin: 0;
            padding: 40px;
        }
        .container {
            display: flex;
            flex-direction: row;
            gap: 40px;
        }
        .left, .right {
            flex: 1;
        }
        img {
            max-width: 100%;
            height: auto;
        }
        .option-group {
            margin-bottom: 20px;
        }
        .option-group h3 {
            margin: 10px 0;
        }
        .colors {
            display: flex;
            gap: 10px;
        }
        .color {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            border: 2px solid #000;
            cursor: pointer;
        }
        button {
            padding: 10px 20px;
            background: black;
            color: white;
            border: none;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>Створи свою унікальну футболку</h1>
    <div class="container">
        <div class="left">
            <img src="shirt-orange.png" alt="Футболка" />
        </div>
        <div class="right">
            <div class="option-group">
                <h3>Місто:</h3>
                <button>Одеса</button>
                <button>Київ</button>
                <button>Львів</button>
                <button>Харків</button>
            </div>
            <div class="option-group">
                <h3>Колір:</h3>
                <div class="colors">
                    <div class="color" style="background: white;"></div>
                    <div class="color" style="background: orange;"></div>
                    <div class="color" style="background: black;"></div>
                    <div class="color" style="background: cyan;"></div>
                    <div class="color" style="background: limegreen;"></div>
                    <div class="color" style="background: purple;"></div>
                    <div class="color" style="background: yellow;"></div>
                    <div class="color" style="background: magenta;"></div>
                    <div class="color" style="background: gray;"></div>
                </div>
            </div>
            <div class="option-group">
                <h3>Розмір:</h3>
                <select>
                    <option>S</option>
                    <option>M</option>
                    <option>L</option>
                    <option>XL</option>
                    <option>XXL</option>
                    <option>116</option>
                    <option>128</option>
                    <option>134</option>
                    <option>140</option>
                    <option>146</option>
                    <option>152</option>
                </select>
            </div>
            <button>Оформити замовлення</button>
        </div>
    </div>
</body>
</html>
